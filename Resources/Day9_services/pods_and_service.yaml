apiVersion: apps/v1
kind: Deployment
metadata:
  name: deployment-service
  labels:
    env: dev
spec:
  replicas: 3
  selector:
    matchLabels:
      env: dev
  template:
    metadata:
      labels:
        env: dev
    spec:
      containers:
      - name: cont-nginx
        image: nginx:latest
        ports:
        - containerPort: 80

---

apiVersion: v1
kind: Service
metadata:
  name: nginx-service
spec:
  type: NodePort
  selector:
    env: dev
  ports:
  - port: 80
    targetPort: 80
    nodePort: 30001

